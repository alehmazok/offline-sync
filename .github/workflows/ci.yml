name: ci

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    # Explicit, so pipelines fail when their first command does
    # (`bash -eo pipefail`); logs are piped through `tee`.
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FRB_VERSION: 2.13.0
  CARGO_EXPAND_VERSION: 1.0.127
  # Generated by flutter_rust_bridge_codegen; must match the Rust API.
  GENERATED: bindings/flutter/lib/src/rust bindings/flutter/rust/src/frb_generated.rs

jobs:
  test:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings/flutter/rust
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path bindings/flutter/rust/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path bindings/flutter/rust/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --workspace
          cargo test --manifest-path bindings/flutter/rust/Cargo.toml
      - name: Convergence test, long run
        run: cargo test -p sync-engine --release --test convergence -- --ignored

  # Generates the Dart bindings, checks the Dart code, builds the example
  # app for Android and runs the end-to-end test on an emulator.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Log folder
        run: |
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings/flutter/rust
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: tools-${{ runner.os }}-frb-${{ env.FRB_VERSION }}-expand-${{ env.CARGO_EXPAND_VERSION }}
      - name: Install codegen
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked 2>&1 | tee "$LOGS/install-codegen.log"
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked 2>&1 | tee -a "$LOGS/install-codegen.log"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version

      - name: Generate bindings
        working-directory: bindings/flutter
        run: |
          flutter pub get 2>&1 | tee "$LOGS/pub-get.log"
          flutter_rust_bridge_codegen generate 2>&1 | tee "$LOGS/codegen.log"
      - name: Commit regenerated bindings
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git add $GENERATED
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Flutter bindings with flutter_rust_bridge $FRB_VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME" 2>&1 | tee "$LOGS/push-generated.log"
          fi
      - name: Check generated bindings are committed
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          git add -N $GENERATED
          git diff --stat --exit-code -- $GENERATED 2>&1 | tee "$LOGS/generated-diff.log"

      - name: Analyze package
        working-directory: bindings/flutter
        run: flutter analyze 2>&1 | tee "$LOGS/analyze-package.log"
      - name: Create example platforms
        working-directory: bindings/flutter/example
        run: |
          ./tool/create_platforms.sh 2>&1 | tee "$LOGS/create-platforms.log"
          flutter pub get 2>&1 | tee -a "$LOGS/create-platforms.log"
      - name: Analyze example
        working-directory: bindings/flutter/example
        run: flutter analyze 2>&1 | tee "$LOGS/analyze-example.log"
      - name: Build APK
        timeout-minutes: 25
        working-directory: bindings/flutter/example
        run: flutter build apk --debug 2>&1 | tee "$LOGS/build-apk.log"

      - name: Start reference server
        run: |
          cargo build --release -p sync-refserver 2>&1 | tee "$LOGS/refserver-build.log"
          nohup ./target/release/sync-refserver \
            --config bindings/flutter/example/server.json \
            --listen 127.0.0.1:8080 > "$LOGS/refserver.log" 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test on an emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: bindings/flutter/example
          # The emulator reaches the host's 127.0.0.1 as 10.0.2.2 (the
          # example's default URL on Android).
          script: bash -o pipefail -c 'flutter test integration_test -d emulator-5554 --reporter expanded 2>&1 | tee "$LOGS/zz-integration-android.log"'

      - name: Report failure
        if: failure() || cancelled()
        run: .github/scripts/report-failure.sh "$LOGS"

  # Builds the example for the iOS simulator and runs the end-to-end test.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Log folder
        run: |
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings/flutter/rust
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: tools-${{ runner.os }}-frb-${{ env.FRB_VERSION }}-expand-${{ env.CARGO_EXPAND_VERSION }}
      - name: Install codegen
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked 2>&1 | tee "$LOGS/install-codegen.log"
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked 2>&1 | tee -a "$LOGS/install-codegen.log"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version

      # Regenerated here too, so this job does not depend on the Android
      # job's commit; the Android job checks the committed copy.
      - name: Generate bindings
        working-directory: bindings/flutter
        run: |
          flutter pub get 2>&1 | tee "$LOGS/pub-get.log"
          flutter_rust_bridge_codegen generate 2>&1 | tee "$LOGS/codegen.log"
      - name: Create example platforms
        working-directory: bindings/flutter/example
        run: |
          ./tool/create_platforms.sh 2>&1 | tee "$LOGS/create-platforms.log"
          flutter pub get 2>&1 | tee -a "$LOGS/create-platforms.log"
      - name: Build for the simulator
        timeout-minutes: 25
        working-directory: bindings/flutter/example
        run: flutter build ios --simulator --debug 2>&1 | tee "$LOGS/build-ios.log"

      - name: Start reference server
        run: |
          cargo build --release -p sync-refserver 2>&1 | tee "$LOGS/refserver-build.log"
          nohup ./target/release/sync-refserver \
            --config bindings/flutter/example/server.json \
            --listen 127.0.0.1:8080 > "$LOGS/refserver.log" 2>&1 &
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k, v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Integration test on the simulator
        timeout-minutes: 25
        working-directory: bindings/flutter/example
        run: flutter test integration_test -d "$SIM_UDID" --reporter expanded 2>&1 | tee "$LOGS/zz-integration-ios.log"

      - name: Report failure
        if: failure() || cancelled()
        run: .github/scripts/report-failure.sh "$LOGS"
