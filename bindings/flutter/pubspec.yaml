name: offline_sync
description: Offline-first data sync for Flutter, backed by a Rust engine.
version: 0.1.0
publish_to: none

environment:
  # flutter_rust_bridge 2.13 needs Dart 3.9.2 (Flutter 3.35).
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Must be the exact version of the Rust crate in rust/Cargo.toml.
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^3.0.6

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
