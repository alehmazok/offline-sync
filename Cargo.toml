[workspace]
resolver = "2"
members = [
    "crates/sync-core",
    "crates/sync-store",
    "crates/sync-net",
    "crates/sync-engine",
    "crates/sync-refserver",
    "crates/sync-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alehmazok/offline-sync"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v7"] }
thiserror = "2.0"
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "functions", "hooks"] }
ureq = "2"
tiny_http = "0.12"

sync-core = { path = "crates/sync-core" }
sync-store = { path = "crates/sync-store" }
sync-net = { path = "crates/sync-net" }
sync-engine = { path = "crates/sync-engine" }
sync-refserver = { path = "crates/sync-refserver" }
sync-conformance = { path = "crates/sync-conformance" }

[profile.dev.package."*"]
opt-level = 1
